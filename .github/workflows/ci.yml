name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchains
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          # Keep the MSRV aligned with Cargo.toml and the check scripts.
          rustup toolchain install 1.85 nightly --profile minimal
          rustup default stable

      - name: Run Linux checks
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./check.sh --msrv --docsrs

      - name: Run Windows checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./check.ps1 -Msrv -Docsrs
