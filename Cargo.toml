[package]
name = "trail-config"
version = "0.5.0"
edition = "2021"
# Set by the dependency tree, not by this crate's own code: indexmap 2.14 (via yaml_serde) and toml 1.1 both require 1.85.
# Verified by building: `cargo +1.85 check` passes with all features and with none (`.\check.ps1 -Msrv`).
# Dev-dependencies need more than this (criterion 0.8 requires 1.86), so `cargo bench` and `cargo test` have a higher floor than using the library does.
rust-version = "1.85"
authors = ["Robert Lampreht <robert.lampreht@gmail.com>"]
description = "A Rust library for reading config files with path-based access, typed deserialization, environment overlays, deep merging, env variable interpolation, and hot reload support."
readme = "README.md"
keywords = ["config", "env", "deserialize", "merge", "hot-reload"]
categories = ["config", "parsing", "filesystem", "development-tools"]
license = "MIT"
repository = "https://github.com/rbt-dev/trail-config.git"
# `cargo package` otherwise takes everything `.gitignore` does not cover, so the review
# notes and the local pre-release script were being unpacked into every consumer's
# registry cache. `README.md` and `CHANGELOG.md` deliberately stay: the first is named by
# `readme` above and rendered on crates.io, and a changelog in the crate is conventional.
# Verify with `cargo package --list` before publishing — a published version cannot be
# replaced, so this is invisible until it is permanent.
exclude = ["IMPROVEMENTS_*.md", "check.ps1"]

[package.metadata.docs.rs]
# `all-features` makes docs.rs *build* the gated items; `--cfg docsrs` makes it *label* them.
# Without the second, `load_json`, `load_toml`, `JsonError`, `TomlError` and friends render
# alongside `load_yaml` with nothing to say they need a feature flag.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# `docsrs` is set only by the docs.rs build above, never by a normal one,
# so the compiler would otherwise flag it as an unrecognised cfg name.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[lib]
name = "trail_config"
path = "src/lib.rs"

[features]
json = ["serde_json"]
toml = ["dep:toml"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "2"
# `preserve_order` backs `toml::map::Map` with an `IndexMap` instead of a `BTreeMap`.
# Without it every TOML config's keys arrive sorted alphabetically, and the document order
# is gone before this crate sees it — making `outline`'s "keys appear in document order"
# and the merge's key-order preservation untrue for `.toml` files alone. `indexmap` is
# already in the tree (`yaml_serde`'s `Mapping` is built on it) and is one of the two
# crates setting the 1.85 MSRV, so this adds no dependency and moves no floor.
#
# The JSON side of the same problem is solved without a feature flag — see
# `src/config/parser/json.rs` — because `serde_json` is common enough in a dependency
# graph that enabling `preserve_order` on it would change other crates' behaviour too.
# `toml::Value` has no such reach, and the datetime handling in `parser/toml.rs` needs it.
toml = { version = "1.1", optional = true, features = ["preserve_order"] }
yaml_serde = "0.10"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

# Criterion supplies its own harness; without this, libtest also claims the target.
[[bench]]
name = "config"
harness = false
